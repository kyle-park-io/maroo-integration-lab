# Maroo testnet Privacy readiness watch (pnpm a:watch-privacy).
# Runs twice a day, read-only against the testnet (queries and eth_estimateGas, no transactions, no keys).
# GitHub can drop a scheduled run under load (the scheduled 2026-10-24 09:30 KST run never started), so a second
# time is set. The record file is named by UTC date: the second run of a day overwrites that day's record and
# still compares with the previous day's record (previousRecordFile in shared/lib/privacy-watch.ts).
# The record is kept as a workflow artifact and in the job summary; nothing is committed.
# The record folder is also kept in the Actions cache, so each run compares with the previous day's record
# from an earlier run instead of the last committed one.
# When proving material for the testnet verifying keys appears, it opens one issue labelled privacy-watch.
name: watch-privacy

on:
  schedule:
    - cron: "30 0 * * *" # 09:30 KST
    - cron: "17 4 * * *" # 13:17 KST, same UTC date as the first run
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch pinned Clairveil and ClairveilJS dependencies for the SDK probe
        run: |
          pnpm setup:clairveil
          (cd vendor/clairveiljs && npm ci --ignore-scripts --no-audit --no-fund)
      - name: Restore records from the previous run
        uses: actions/cache/restore@v6
        with:
          path: track-a-explain/evidence/live/watch-privacy/
          key: watch-privacy-records-${{ github.run_id }}
          restore-keys: watch-privacy-records-
      - name: Watch
        id: watch
        # shell: bash adds pipefail, so a crash in the watch script fails the job instead of being hidden by tee
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm a:watch-privacy | tee watch.txt
      - name: Job summary
        if: always()
        run: |
          { echo '```text'; cat watch.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep records for the next run
        if: always()
        uses: actions/cache/save@v6
        with:
          path: track-a-explain/evidence/live/watch-privacy/
          key: watch-privacy-records-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: watch-privacy-${{ github.run_id }}
          path: track-a-explain/evidence/live/watch-privacy/
      - name: Open an issue when proving material appears
        if: steps.watch.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh issue list --label privacy-watch --state open --json number --jq length)" = "0" ]; then
            gh label create privacy-watch --color 2347C5 --force
            gh issue create --label privacy-watch \
              --title "Maroo testnet Privacy: proving material appeared" \
              --body "pnpm a:watch-privacy reported that proving material for the testnet verifying keys is available. Run pnpm a:probe-sdk --rest with a prover and test layer 5 (proof verification). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
